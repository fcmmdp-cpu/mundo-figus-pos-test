<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF Caja TEST — datos de demostración</title>
<style>
 body{font-family:Roboto,Arial,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#1c1f26}
 h1{font-size:22px} button{display:block;width:100%;padding:18px;margin:12px 0;font-size:18px;font-weight:700;border:0;border-radius:12px;color:#fff;background:#2166d6}
 button.borrar{background:#e0393e} #estado{margin:16px 0;padding:12px;background:#f3f4f6;border-radius:10px;min-height:24px}
 a{font-size:18px}
</style></head><body>
<h1>MF Caja TEST — datos de demostración</h1>
<p>Esta página escribe <strong>ventas inventadas</strong> en la base de prueba de este navegador
(<code>mundoFigusPOS_TEST</code>). No toca la caja real ni Google Sheets.</p>
<button id="cargar">Cargar datos de demostración (6 jornadas)</button>
<button id="borrar" class="borrar">Borrar todo lo de la versión TEST</button>
<div id="estado">Listo.</div>
<p><a href="/mundo-figus-pos-test/index.html">Abrir la caja TEST &rarr;</a></p>
<script src="/mundo-figus-pos-test/js/db.js"></script>
<script src="/mundo-figus-pos-test/js/demo-datos.js"></script>
<script>
 const est = document.getElementById('estado');
 function hoyLocal(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
 document.getElementById('cargar').onclick = async () => {
   est.textContent = 'Cargando…';
   try { const n = await DemoDatos.cargarEnBase({ hoy: hoyLocal() }); est.textContent = 'Listo: ' + n + ' ventas de demostración cargadas. Abrí la caja TEST y entrá a Estadísticas.'; }
   catch (e) { est.textContent = 'Error: ' + e.message; }
 };
 document.getElementById('borrar').onclick = async () => {
   est.textContent = 'Borrando…';
   try { await DemoDatos.borrarBase(); est.textContent = 'Listo: base de prueba vacía.'; }
   catch (e) { est.textContent = 'Error: ' + e.message; }
 };
</script></body></html>
